name: WebAssembly build v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starfighter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v6

      - name: Checkout Project Starfighter upstream
        uses: actions/checkout@v6
        with:
          repository: pr-starfighter/starfighter
          ref: 315d0456723e19a153dbc5ef37d5cfb27b4cb36c
          path: upstream

      - name: Apply web UI localization and performance patches
        run: |
          python3 scripts/patch_hardcoded_ui.py.txt
          python3 scripts/patch_shop_buttons.py.txt
          python3 scripts/patch_shop_performance.py.txt
          python3 scripts/patch_hd_output.py.txt
          python3 - <<'PY'
          from pathlib import Path
          shop = Path('upstream/src/shop.c').read_text(encoding='utf-8')
          body = shop.split('void shop_show()', 1)[1].split('if ((engine.keyState[KEY_FIRE]))', 1)[0]
          assert '\n\tdrawShop();\n' not in body, 'shop_show still rebuilds drawShop every frame'
          engine = Path('upstream/src/engine.c').read_text(encoding='utf-8')
          assert 'windowWidth = screen->w * 8 / 5' in engine, 'HD browser backing output patch missing'
          print('Shop per-frame rebuild disabled')
          print('Browser backing output target: 1280x960 for 800x600 logical mode')
          PY

      - name: Audit Russian localization coverage
        run: |
          mkdir -p dist
          cp scripts/audit_i18n.py.txt /tmp/audit_i18n.py
          python3 /tmp/audit_i18n.py --strict --strict-ui

      - name: Audit Yandex Games moderation integration
        run: python3 scripts/audit_yandex.py.txt

      - name: Checkout Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Install Emscripten
        run: |
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          source emsdk/emsdk_env.sh
          emcc --version

      - name: Prepare platform bridge and web patches
        run: |
          cp web/platform-pre-release.txt web/platform-pre.js
          cp scripts/patch_web_release.py.txt /tmp/patch_web.py
          python3 /tmp/patch_web.py
          cp scripts/patch_menu_marker.py.txt /tmp/patch_menu_marker.py
          python3 /tmp/patch_menu_marker.py

      - name: Stage runtime assets only
        run: |
          rm -rf runtime-assets
          mkdir -p runtime-assets/data runtime-assets/gfx runtime-assets/sound runtime-assets/music
          cp upstream/data/credits.txt runtime-assets/data/
          find upstream/gfx -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' \) -exec cp {} runtime-assets/gfx/ \;
          find upstream/sound -maxdepth 1 -type f -name '*.ogg' -exec cp {} runtime-assets/sound/ \;
          find upstream/music -maxdepth 1 -type f -name '*.ogg' -exec cp {} runtime-assets/music/ \;
          echo "Runtime assets:"
          find runtime-assets -type f | sort
          test "$(find runtime-assets/music -type f -name '*.ogg' | wc -l)" -eq 12
          test "$(find runtime-assets/sound -type f -name '*.ogg' | wc -l)" -gt 0
          test -s runtime-assets/data/credits.txt
          test ! -e runtime-assets/data/TakaoPGothic.ttf
          test ! -e runtime-assets/music/sources

      - name: Build CSP-safe standalone browser target
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p dist
          emcc upstream/src/*.c \
            -Iupstream/src \
            -DVERSION='"2.5-web1"' \
            -DDATADIR='"/"' \
            -DNOFONT \
            -O2 \
            -sUSE_SDL=2 \
            -sUSE_SDL_IMAGE=2 \
            -sSDL2_IMAGE_FORMATS='["png","jpg"]' \
            -sUSE_SDL_MIXER=2 \
            -sSDL2_MIXER_FORMATS='["ogg"]' \
            -sASYNCIFY \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFORCE_FILESYSTEM=1 \
            -sEXIT_RUNTIME=0 \
            -sEXPORTED_FUNCTIONS='["_main","_save"]' \
            -lidbfs.js \
            --pre-js web/platform-pre.js \
            --pre-js web/yandex-language-gate.txt \
            --preload-file runtime-assets/data@/data \
            --preload-file runtime-assets/gfx@/gfx \
            --preload-file runtime-assets/sound@/sound \
            --preload-file runtime-assets/music@/music \
            --shell-file web/shell.html \
            -o dist/index.html
          cp web/bootstrap.js dist/bootstrap.js
          cp upstream/COPYING upstream/LICENSES dist/
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.data
          test -s dist/bootstrap.js
          du -ah dist | sort -h | tail -n 20

      - name: Validate CSP-safe HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('dist/index.html').read_text(encoding='utf-8', errors='replace')
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script>', html, flags=re.I | re.S)
          src_pattern = r'\bsrc\s*=\s*(?:"[^"]+"|\'[^\']+\'|[^\s>]+)'
          inline = [(attrs, body[:80]) for attrs, body in scripts if not re.search(src_pattern, attrs, flags=re.I) or body.strip()]
          handlers = re.findall(r'\son[a-z]+\s*=\s*["\']', html, flags=re.I)
          javascript_urls = re.findall(r'(?:href|src)\s*=\s*["\']\s*javascript:', html, flags=re.I)
          print('Script tags:', len(scripts))
          print('Inline scripts:', len(inline))
          print('Inline event handlers:', len(handlers))
          assert not inline, f'Inline scripts are forbidden by Yandex nonce CSP: {inline}'
          assert not handlers, 'Inline event handlers are forbidden by Yandex nonce CSP'
          assert not javascript_urls, 'javascript: URLs are forbidden by Yandex CSP'
          assert 'bootstrap.js' in html and 'index.js' in html, 'external bootstrap/Emscripten scripts are missing'
          PY

      - name: Yandex-mocked Chromium runtime smoke test
        run: |
          cp scripts/starfighter-smoke.sh.txt /tmp/starfighter-smoke.sh
          bash /tmp/starfighter-smoke.sh

      - name: Validate Yandex release payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dist')
          diagnostics = {'i18n-audit.txt', 'yandex-moderation-audit.txt'}
          release = [p for p in root.rglob('*') if p.is_file() and not p.name.startswith('runtime-') and p.name not in diagnostics and p.name != 'sdk.js']
          assert (root / 'index.html') in release, 'index.html must be in archive root'

          bad = []
          total = 0
          for path in release:
              rel = path.relative_to(root).as_posix()
              total += path.stat().st_size
              if ' ' in rel or any(ord(ch) > 127 for ch in rel):
                  bad.append(rel)

          print('Release files:', len(release))
          print('Uncompressed release bytes:', total)
          assert not bad, f'Invalid archive paths: {bad}'
          assert total < 100_000_000, f'Uncompressed payload is too large: {total} bytes'
          PY

      - name: Package Yandex Games archive
        run: |
          rm -f dist/sdk.js
          cd dist
          zip -9 -r ../starfighter-yandexgames.zip . -x 'runtime-*' -x 'i18n-audit.txt' -x 'yandex-moderation-audit.txt'
          cd ..
          unzip -l starfighter-yandexgames.zip
          ls -lh starfighter-yandexgames.zip

      - name: Upload browser build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfighter-yandexgames-v2
          path: |
            starfighter-yandexgames.zip
            dist/
