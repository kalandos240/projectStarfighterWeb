name: Capture multi-mission Yandex screenshots
# Chrome DevTools forces the page viewport to exactly 1280x720.

on:
  push:
    paths:
      - '.github/workflows/capture-multi-mission-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v6

      - name: Checkout pinned upstream
        uses: actions/checkout@v6
        with:
          repository: pr-starfighter/starfighter
          ref: 315d0456723e19a153dbc5ef37d5cfb27b4cb36c
          path: upstream

      - name: Apply normal web-port patches
        run: |
          python3 scripts/patch_hardcoded_ui.py.txt
          python3 scripts/patch_shop_buttons.py.txt
          python3 scripts/patch_shop_performance.py.txt
          python3 scripts/patch_hd_output.py.txt
          cp web/platform-pre-release.txt web/platform-pre.js
          cp scripts/patch_web_release.py.txt /tmp/patch_web.py
          python3 /tmp/patch_web.py
          cp scripts/patch_menu_marker.py.txt /tmp/patch_menu_marker.py
          python3 /tmp/patch_menu_marker.py
          python3 scripts/promo_direct_mission_patch.py

      - name: Checkout Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Install Emscripten
        run: |
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest

      - name: Stage runtime assets
        run: |
          rm -rf runtime-assets
          mkdir -p runtime-assets/data runtime-assets/gfx runtime-assets/sound runtime-assets/music
          cp upstream/data/credits.txt runtime-assets/data/
          find upstream/gfx -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' \) -exec cp {} runtime-assets/gfx/ \;
          find upstream/sound -maxdepth 1 -type f -name '*.ogg' -exec cp {} runtime-assets/sound/ \;
          find upstream/music -maxdepth 1 -type f -name '*.ogg' -exec cp {} runtime-assets/music/ \;

      - name: Build promo-only browser executable
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p dist
          emcc upstream/src/*.c \
            -Iupstream/src \
            -DVERSION='"2.5-web1"' \
            -DDATADIR='"/"' \
            -DNOFONT -O2 \
            -sUSE_SDL=2 \
            -sUSE_SDL_IMAGE=2 \
            -sSDL2_IMAGE_FORMATS='["png","jpg"]' \
            -sUSE_SDL_MIXER=2 \
            -sSDL2_MIXER_FORMATS='["ogg"]' \
            -sASYNCIFY \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFORCE_FILESYSTEM=1 \
            -sEXIT_RUNTIME=0 \
            -sEXPORTED_FUNCTIONS='["_main","_save"]' \
            -lidbfs.js \
            --pre-js web/platform-pre.js \
            --pre-js web/yandex-language-gate.txt \
            --preload-file runtime-assets/data@/data \
            --preload-file runtime-assets/gfx@/gfx \
            --preload-file runtime-assets/sound@/sound \
            --preload-file runtime-assets/music@/music \
            --shell-file web/shell.html \
            -o dist/index.html
          cp web/bootstrap.js dist/bootstrap.js

      - name: Capture 8 different missions in Russian and English
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p screenshots/ru screenshots/en
          python3 -m http.server 8765 --directory dist >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          capture_one() {
            lang="$1"
            mission="$2"
            port="$3"
            outfile="$4"
            printf "%s\n" "globalThis.YaGames={init:async()=>({environment:{i18n:{lang:'${lang}'}},features:{LoadingAPI:{ready(){}},GameplayAPI:{start(){},stop(){}}},on(){},getPlayer:async()=>({getData:async()=>({}),setData:async()=>{}}),adv:{showFullscreenAdv(){}}})};" > dist/sdk.js
            profile="$(mktemp -d)"
            "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --autoplay-policy=no-user-gesture-required --window-size=1280,720 --remote-debugging-address=127.0.0.1 --remote-debugging-port="$port" --user-data-dir="$profile" "http://127.0.0.1:8765/index.html?promo=${mission}" >/tmp/${lang}-${mission}.out 2>/tmp/${lang}-${mission}.log &
            pid=$!
            CDP_PORT="$port" MISSION="$mission" OUT="$outfile" node scripts/capture_multi_mission.js
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 0.2
            rm -rf "$profile" 2>/dev/null || true
          }

          missions=(HAIL CERADSE JOLDAR MOEBO NEROD ODEON JUPITER EARTH)
          idx=0
          for lang in ru en; do
            n=0
            for mission in "${missions[@]}"; do
              idx=$((idx+1))
              n=$((n+1))
              port=$((9300+idx))
              capture_one "$lang" "$mission" "$port" "screenshots/$lang/$(printf '%02d' "$n")_${mission}.png"
            done
          done
          rm -f dist/sdk.js

          test "$(find screenshots/ru -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 8
          test "$(find screenshots/en -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 8
          file screenshots/ru/*.png
          file screenshots/en/*.png

      - name: Upload multi-mission screenshots
        uses: actions/upload-artifact@v4
        with:
          name: starfighter-yandex-multi-mission-screenshots
          path: screenshots/
          retention-days: 7
