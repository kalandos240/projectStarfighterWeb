name: WebAssembly build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Verify Emscripten
        run: emcc --version
      - name: Build web port
        run: |
          if [ -x ./web/build.sh ]; then
            ./web/build.sh
          else
            echo "web/build.sh is not present yet; source import is still in progress."
          fi
