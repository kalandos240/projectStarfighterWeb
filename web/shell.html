<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Project: Starfighter</title>
  <script src="/sdk.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
    #canvas{width:100%;height:100%;object-fit:contain;outline:none;display:block}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#000;z-index:10}
    #loading.hidden{display:none}
  </style>
</head>
<body>
  <div id="loading">Loading Project: Starfighter…</div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    const canvas=document.getElementById('canvas');
    const loading=document.getElementById('loading');

    globalThis.starfighterMissionStartedAt=0;
    globalThis.starfighterLastInterstitialAt=0;
    globalThis.starfighterMissionEnded=function(){
      const sdk=globalThis.starfighterYsdk;
      const now=Date.now();
      const startedAt=globalThis.starfighterMissionStartedAt||0;
      globalThis.starfighterMissionStartedAt=0;
      if(!sdk||!sdk.adv||typeof sdk.adv.showFullscreenAdv!=='function')return;
      if(!startedAt||now-startedAt<60000)return;
      if(now-globalThis.starfighterLastInterstitialAt<120000)return;

      globalThis.starfighterLastInterstitialAt=now;
      globalThis.starfighterPlatformPaused=true;
      try{
        sdk.adv.showFullscreenAdv({callbacks:{
          onOpen:function(){
            globalThis.starfighterPlatformPaused=true;
            document.documentElement.setAttribute('data-starfighter-ad-open','1');
          },
          onClose:function(wasShown){
            globalThis.starfighterPlatformPaused=false;
            document.documentElement.setAttribute('data-starfighter-ad-closed',wasShown?'1':'0');
            canvas.focus();
          },
          onError:function(err){
            globalThis.starfighterPlatformPaused=false;
            console.warn('Yandex fullscreen ad failed:',err);
            canvas.focus();
          }
        }});
      }catch(err){
        globalThis.starfighterPlatformPaused=false;
        console.warn('Could not request Yandex fullscreen ad:',err);
      }
    };

    var Module={
      canvas:canvas,
      onRuntimeInitialized:function(){
        loading.classList.add('hidden');
        canvas.focus();
        document.documentElement.setAttribute('data-starfighter-shell-ready','1');
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
