<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Project: Starfighter</title>
  <script src="/sdk.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
    body{display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #canvas{
      width:min(100vw,177.777778vh);
      height:min(100vh,56.25vw);
      max-width:100vw;
      max-height:100vh;
      aspect-ratio:16/9;
      outline:none;
      display:block;
      image-rendering:auto;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;color:#fff;background:#000;z-index:10;text-align:center;padding:24px;box-sizing:border-box}
    #loading-title{font-size:18px;font-weight:600}
    #loading-controls{max-width:760px;font-size:14px;line-height:1.55;color:#cfcfcf}
    #loading-controls b{color:#fff;font-weight:700}
    #loading.hidden{display:none}
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-title">Загрузка Project: Starfighter…</div>
    <div id="loading-controls"><b>WASD</b> — движение · <b>ЛКМ / Space</b> — основной огонь · <b>ПКМ / Ctrl</b> — дополнительное оружие · <b>E / Shift</b> — смена оружия · <b>Esc</b> — пауза</div>
  </div>
  <canvas id="canvas" tabindex="0"></canvas>
  <script src="bootstrap.js"></script>
